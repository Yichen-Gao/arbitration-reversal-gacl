# Free-form / open-ended generation prompts for appendix checks.
# Main quantitative results use short-label / closed-set protocols; this file
# records the less constrained generation surface used for boundary checks.

format: |
  {question}
  {text_block}

branches:
  joint_conflict:
    text_block: "Text evidence: {conflict_text}"
  faithful_joint:
    text_block: "Text evidence: {faithful_text}"
  audio_reference:
    text_block: ""
  text_only:
    text_block: "Text evidence: {conflict_text}"

protocol:
  decoding: open_ended_generation
  candidates_in_prompt: false
  prefix_trie: false
  evaluation: semantic_label_mapping
  hypothesis_set: normalized_branch_answers

normalization:
  strip_markdown: true
  strip_quotes: true
  strip_trailing_punctuation: true
  casefold: true
  alias_folding: evaluator_defined
